<script>
const APP='auditOvinGDS_v1';
const APP_VERSION='2.4';
const DEFAULT_SUPABASE_URL='https://ckylznynqsefqkmtjcjf.supabase.co';
const CLOUD_ID='audit-ovin-main';
let cloudTimer=null, cloudBusy=false, cloudPending=false, renderPending=false;
let authSession=JSON.parse(localStorage.getItem('auditOvin.authSession')||'null');
let currentProfile=null;
function cloudCfg(){return {url:(localStorage.getItem('auditOvin.supabaseUrl')||localStorage.getItem('parage.supabaseUrl')||DEFAULT_SUPABASE_URL).replace(/\/rest\/v1\/?$/,'').replace(/\/$/,''),key:localStorage.getItem('auditOvin.supabaseKey')||localStorage.getItem('parage.supabaseKey')||''}}
function setCloudStatus(txt){let e=document.getElementById('cloudStatus');if(e)e.textContent=txt}
function authHeaders(extra={}){let c=cloudCfg();return Object.assign({'apikey':c.key,'Content-Type':'application/json'},authSession?.access_token?{'Authorization':'Bearer '+authSession.access_token}:{},extra)}
async function supa(path,opt={}){let c=cloudCfg();if(!c.key)throw new Error('Clé publique Supabase non renseignée');if(!authSession?.access_token)throw new Error('Utilisateur non connecté');let h=Object.assign(authHeaders(),opt.headers||{});let r=await fetch(c.url+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(r.status===401&&await refreshAuthSession()){h=Object.assign(authHeaders(),opt.headers||{});r=await fetch(c.url+'/rest/v1/'+path,Object.assign({},opt,{headers:h}))}return r}

function saveLoginCloudConfig(){
  let u=(document.getElementById('loginSupaUrl').value||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
  let k=(document.getElementById('loginSupaKey').value||'').trim();
  if(!u||!k){document.getElementById('loginMessage').textContent='Renseignez l’URL et la clé publique.';return}
  localStorage.setItem('auditOvin.supabaseUrl',u);localStorage.setItem('auditOvin.supabaseKey',k);
  document.getElementById('loginMessage').textContent='Configuration Supabase enregistrée.';
}
async function signIn(){
  let email=(document.getElementById('loginEmail').value||'').trim(),password=document.getElementById('loginPassword').value||'',c=cloudCfg();
  if(!c.key){document.getElementById('loginMessage').textContent='Configurez d’abord la clé publique Supabase.';return}
  if(!email||!password){document.getElementById('loginMessage').textContent='Saisissez l’e-mail et le mot de passe.';return}
  document.getElementById('loginMessage').textContent='Connexion…';
  try{
    let r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    let data=await r.json();if(!r.ok)throw new Error(data.error_description||data.msg||'Connexion refusée');
    authSession=data;localStorage.setItem('auditOvin.authSession',JSON.stringify(data));
    await loadCurrentProfile();enterApplication();
  }catch(e){document.getElementById('loginMessage').textContent=e.message||'Erreur de connexion'}
}
async function refreshAuthSession(){
  if(!authSession?.refresh_token)return false;let c=cloudCfg();if(!c.key)return false;
  try{let r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:authSession.refresh_token})});if(!r.ok)return false;authSession=await r.json();localStorage.setItem('auditOvin.authSession',JSON.stringify(authSession));return true}catch{return false}
}
async function loadCurrentProfile(){
  let c=cloudCfg();let r=await fetch(c.url+'/rest/v1/profiles?id=eq.'+encodeURIComponent(authSession.user.id)+'&select=id,email,display_name,role,active',{headers:authHeaders()});
  if(r.status===401&&await refreshAuthSession())return loadCurrentProfile();
  if(!r.ok)throw new Error('Profil utilisateur introuvable.');
  let rows=await r.json();if(!rows.length)throw new Error('Aucun profil associé à ce compte.');
  currentProfile=rows[0];if(currentProfile.active===false)throw new Error('Ce compte a été désactivé.');
}
function enterApplication(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('userBox').classList.remove('hidden');
  document.getElementById('userBadge').textContent=(currentProfile.display_name||currentProfile.email)+' · '+(currentProfile.role||'technicien');
  setCloudStatus('☁️ Connecté');
  cloudRestoreSilent();setTimeout(()=>refreshVisitPresence(true),200);
}
async function signOut(){
  try{let c=cloudCfg();await fetch(c.url+'/auth/v1/logout',{method:'POST',headers:authHeaders()})}catch{}
  authSession=null;currentProfile=null;localStorage.removeItem('auditOvin.authSession');location.reload();
}
async function cloudRestoreSilent(){
  if(isEditableActive()){cloudPending=true;return}
  try{

async function cloudBackup(showMessage=true){
  if(isEditableActive()&&!showMessage){cloudPending=true;setCloudStatus('☁️ Saisie locale • synchro en attente');return false}
  if(cloudBusy)return false;
  let c=cloudCfg();
  if(!c.key){setCloudStatus('☁️ Supabase à configurer');if(showMessage)alert('Renseignez la clé publique Supabase dans Sauvegarde.');return false}
  cloudBusy=true;
  if(showMessage)setCloudStatus('☁️ Synchronisation…');
  try{
    let payload={id:CLOUD_ID,payload:db,updated_at:new Date().toISOString()};
    let r=await supa('ovin_backups?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});
    if(!r.ok)throw new Error(await r.text());
    localStorage.setItem('auditOvin.lastSync',new Date().toISOString());
    setCloudStatus('☁️ Cloud à jour');
    if(showMessage)alert('Sauvegarde Supabase effectuée.');
    return true
  }catch(e){
    console.error(e);setCloudStatus('☁️ En attente d’envoi');

    return false
  }finally{cloudBusy=false}
}

function measureClassForReport(s,k,val){
  let r=refs[s.stage]?.[k],n=Number(normalizeDecimal(val));
  if(!r||Number.isNaN(n))return '';
  if(n<r[0]||n>r[1])return 'm-bad';
  const span=Math.max(0.0001,r[1]-r[0]),edge=span*.15;
  if(n<r[0]+edge||n>r[1]-edge)return 'm-warn';
  return 'm-ok';
}
function reportMeasureTable(ss){
  const keys=Object.keys(measureLabels);
  return ss.map(s=>{
    const filled=keys.filter(k=>String(s.measures?.[k]??'').trim()!=='');
    if(!filled.length)return '';
    return `<div class="report-section"><h4>${esc(s.name)} — ${esc(s.stage)} — effectif ${s.count||1}</h4><table class="report-table"><tr><th>Mesure</th><th>Valeur</th><th>Lecture</th></tr>${filled.map(k=>`<tr><td>${esc(measureLabels[k])}</td><td class="${measureClassForReport(s,k,s.measures[k])}">${esc(s.measures[k])}</td><td>${classify(k,s.measures[k],s.stage).replace(/<[^>]+>/g,' ')}</td></tr>`).join('')}</table></div>`;
  }).join('');
}
function reportObservations(ss){

}

ires, parasitisme ovin, FECRT, molécules/exemples de spécialités ovines, ration chiffrée avec valeurs types INRAE, minéraux/bolus, couverture des besoins et alerte spécifique cuivre.</p></div>`}

 coccidia:{label:'Coccidies / Eimeria',aliases:['coccid','eimeria'],impact:'Diarrhée, retard de croissance surtout chez les jeunes.',checks:'Âge, symptômes, hygiène, densité, espèce et charge.',molecules:[['Toltrazuril','ex. TOLTRANIL 50 mg/mL pour ovins selon RCP']],note:'Traitement et timing dépendent de l’âge et du contexte épidémiologique.'},
 crypto:{label:'Cryptosporidium',aliases:['crypto'],impact:'Diarrhée néonatale, déshydratation.',checks:'Âge, diagnostic différentiel, hygiène et réhydratation.',molecules:[],note:'Pas de traitement antiparasitaire automatique proposé.'},

function parKey(n=''){n=String(n).toLowerCase();return Object.keys(PAR_OVIN).find(k=>PAR_OVIN[k].aliases.some(a=>n.includes(a)))||''}
function parStatus(r){const s=r.labStatus||'auto';if(s!=='auto')return s;const v=num(r.value);if(v===null)return String(r.value).toLowerCase().includes('posit')?'positif':'à interpréter';if(/opg/i.test(r.unit||'')){if(v<200)return 'faible';if(v<500)return 'modéré';return 'élevé'}return v>0?'positif':'négatif'}
function renderParasitism(){const v=ensureExtendedVisit(activeVisit());if(!v){parasitism.innerHTML='<div class="card">Ouvrez une visite.</div>';return}const p=v.parasitism,fe=(num(p.fecrt.before)>0&&num(p.fecrt.after)!==null)?Math.round((num(p.fecrt.before)-num(p.fecrt.after))/num(p.fecrt.before)*1000)/10:null;parasitism.innerHTML=`<div class="card"><h2>🦠 Parasitisme ovin</h2><p class="small">Copro, douves, coccidies, strongles pulmonaires, traitements et contrôle d’efficacité. Les OPG sont contextualisés, pas utilisés seuls pour prescrire.</p><div class="grid cols-4"><div class="field"><label>Laboratoire</label><input id="oparlab" value="${esc(p.lab)}"></div><div class="field"><label>Date</label><input id="opardate" type="date" value="${esc(p.date)}"></div><div class="field"><label>Lot / catégorie</label><input id="oparcat" value="${esc(p.category)}"></div><div class="field"><label>Pâturage / contexte</label><input id="oparpast" value="${esc(p.pasture)}"></div></div><div class="grid"><div class="field"><label>Signes</label><textarea id="oparsym">${esc(p.symptoms)}</textarea></div><div class="field"><label>Dernier traitement</label><input id="opartreat" value="${esc(p.lastTreatment)}"><label>Molécule</label><input id="oparmol" value="${esc(p.lastMolecule)}"></div></div><div class="paper-entry-box"><b>📝 Saisie rapide</b><div class="actions" style="margin-top:8px"><button class="btn" onclick="presetParOvin('standard')">Copro standard</button><button class="btn alt" onclick="presetParOvin('agneaux')">Agneaux</button><button class="btn alt" onclick="presetParOvin('complete')">Bilan complet</button><button class="btn alt" onclick="addParRowOvin()">+ Ligne</button></div></div></div><div class="card"><div class="table-wrap"><table class="compact-table"><thead><tr><th>Animal / lot</th><th>Parasite</th><th>Résultat</th><th>Unité</th><th>Lecture</th><th></th></tr></thead><tbody>${p.rows.map(r=>`<tr data-prow="${r.id}"><td><input data-pf="animal" value="${esc(r.animal||'')}"></td><td><input data-pf="parasite" value="${esc(r.parasite||'')}"></td><td><input data-pf="value" value="${esc(r.value||'')}"></td><td><input data-pf="unit" value="${esc(r.unit||'')}"></td><td><select data-pf="labStatus">${['auto','négatif','faible','modéré','élevé','positif'].map(x=>`<option value="${x}" ${r.labStatus===x?'selected':''}>${x==='auto'?parStatus(r):x}</option>`).join('')}</select></td><td><button class="btn danger" onclick="deleteParRowOvin('${r.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="6">Aucun résultat.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Contrôle d’efficacité (FECRT)</h3><div class="grid"><div class="field"><label>OPG avant</label><input id="ofeb" inputmode="decimal" value="${esc(p.fecrt.before)}"></div><div class="field"><label>OPG après</label><input id="ofea" inputmode="decimal" value="${esc(p.fecrt.after)}"></div><div class="field"><label>Délai</label><input id="ofed" value="${esc(p.fecrt.days)}"></div></div>${fe===null?'':'<p><b>Réduction calculée : '+fe+' %</b></p>'}<p class="small">Une efficacité insuffisante doit conduire à vérifier protocole, dose, poids, délai, identification parasitaire et résistance avec le vétérinaire.</p></div><div class="card"><div class="header-row"><h3>🩸 Pepsinogène sérique</h3><button class="btn alt" onclick="addPepOvin()">+ Dosage</button></div><p class="small">Le document Labocéa fourni donne un repère bovin de 300–600 mUT. Aucune référence ovine n’est fournie : saisie possible, interprétation selon le laboratoire.</p>${p.pepsinogen.map(r=>`<div class="grid" data-opep="${r.id}"><input data-opepf="animal" value="${esc(r.animal||'')}" placeholder="animal/lot"><input data-opepf="value" value="${esc(r.value||'')}" placeholder="mUT"><button class="btn danger" onclick="delPepOvin('${r.id}')">×</button></div>`).join('')}</div><div class="card"><div class="header-row"><h3>🧪 Sérologie grande douve</h3><button class="btn alt" onclick="addSeroOvin()">+ Sérologie</button></div>${p.serologies.map(r=>`<div class="grid" data-osero="${r.id}"><input data-oserof="animal" value="${esc(r.animal||'')}" placeholder="animal/mélange"><input data-oserof="count" value="${esc(r.count||'')}" placeholder="nb animaux"><select data-oserof="result">${['Négatif','Douteux','Positif','Ininterprétable'].map(x=>`<option ${r.result===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn danger" onclick="delSeroOvin('${r.id}')">×</button></div>`).join('')}</div><div class="card"><h3>Interprétation & options thérapeutiques</h3>${parSummaryOvin(v)}<div class="field"><label>Conclusion technicien</label><textarea id="oparnotes">${esc(p.notes)}</textarea></div></div>`;document.querySelectorAll('[data-pf]').forEach(el=>el.onchange=()=>{const r=p.rows.find(x=>x.id===el.closest('tr').dataset.prow);r[el.dataset.pf]=el.value;saveQuiet();renderParasitism()});[['oparlab','lab'],['opardate','date'],['oparcat','category'],['oparpast','pasture'],['oparsym','symptoms'],['opartreat','lastTreatment'],['oparmol','lastMolecule'],['oparnotes','notes']].forEach(([eid,k])=>{document.getElementById(eid).oninput=e=>{p[k]=e.target.value;saveQuiet()}});[['ofeb','before'],['ofea','after'],['ofed','days']].forEach(([eid,k])=>document.getElementById(eid).onchange=e=>{p.fecrt[k]=e.target.value;saveQuiet();renderParasitism()});document.querySelectorAll('[data-opepf]').forEach(el=>el.oninput=()=>{const r=p.pepsinogen.find(x=>x.id===el.closest('[data-opep]').dataset.opep);r[el.dataset.opepf]=el.value;saveQuiet()});document.querySelectorAll('[data-oserof]').forEach(el=>el.onchange=()=>{const r=p.serologies.find(x=>x.id===el.closest('[data-osero]').dataset.osero);r[el.dataset.oserof]=el.value;saveQuiet()})}
function addPepOvin(){const p=ensureExtendedVisit(activeVisit()).parasitism;p.pepsinogen.push({id:id(),animal:'',value:''});save()}function delPepOvin(x){const p=ensureExtendedVisit(activeVisit()).parasitism;p.pepsinogen=p.pepsinogen.filter(r=>r.id!==x);save()}function addSeroOvin(){const p=ensureExtendedVisit(activeVisit()).parasitism;p.serologies.push({id:id(),animal:'',count:'',result:'Négatif'});save()}function delSeroOvin(x){const p=ensureExtendedVisit(activeVisit()).parasitism;p.serologies=p.serologies.filter(r=>r.id!==x);save()}
function presetParOvin(mode){const v=ensureExtendedVisit(activeVisit()),p=v.parasitism;let names=mode==='agneaux'?['Strongles gastro-intestinaux','Nematodirus','Coccidies / Eimeria','Cryptosporidium']:['Strongles gastro-intestinaux','Grande douve — Fasciola hepatica','Coccidies / Eimeria'];if(mode==='complete')names=['Strongles gastro-intestinaux','Haemonchus','Nematodirus','Strongles pulmonaires / Dictyocaulus filaria','Grande douve — Fasciola hepatica','Petite douve — Dicrocoelium','Coccidies / Eimeria','Cryptosporidium','Ténia / Moniezia'];p.rows=names.map(x=>({id:id(),animal:p.category||'',parasite:x,value:'',unit:x.includes('Strongles')||x.includes('Haemonchus')||x.includes('Nematodirus')||x.includes('Coccidies')?'OPG':'',labStatus:'auto'}));save();show('parasitism')}
function addParRowOvin(){const p=ensureExtendedVisit(activeVisit()).parasitism;p.rows.push({id:id(),animal:p.category||'',parasite:'Strongles gastro-intestinaux',value:'',unit:'OPG',labStatus:'auto'});save()}
function deleteParRowOvin(rid){const p=ensureExtendedVisit(activeVisit()).parasitism;p.rows=p.rows.filter(r=>r.id!==rid);save()}
function parSummaryOvin(v){if(!v.parasitism.rows.length)return '<div class="small">Ajoutez des résultats.</div>';return v.parasitism.rows.map(r=>{const k=PAR_OVIN[parKey(r.parasite)];if(!k)return '';return `<div class="interpret-card warning"><b>${esc(k.label)} — ${esc(parStatus(r))}</b><p><b>Impacts :</b> ${esc(k.impact)}</p><p><b>À vérifier :</b> ${esc(k.checks)}</p>${k.molecules.length?'<p><b>Molécules / exemples :</b><br>'+k.molecules.map(x=>esc(x[0])+' — '+esc(x[1])).join('<br>')+'</p>':''}<p class="small">⚠️ Aide au choix, pas une prescription. ${esc(k.note)} Vérifier le RCP ANMV à jour, ordonnance, lait/viande et délais d’attente.</p></div>`}).join('')}

function mineralTargetOvin(k){const v=num(ensureOvinSettings().mineralTargets[k]);return v===null?OVIN_MINERAL_TARGETS[k]:v}
function supplementDailyOvin(prod,sup){const out={};if(!prod)return out;const d=num(sup.dose);if(d===null)return out;for(const k of Object.keys(OVIN_MINERAL_TARGETS)){const c=num(prod.composition?.[k]);if(c===null)continue;if(prod.type==='Bolus'){out[k]=c/Math.max(1,num(prod.releaseDays)||1)}else{const kg=sup.doseUnit==='kg/j'?d:d/1000;out[k]=c*kg}}return out}
function rationMineralsOvin(v){const out={dm:0,cu:0,zn:0,mn:0,se:0,co:0};for(const r of v.feed.rationLines){const ref=allOvinFeedRefs()[r.feedRefId],q=num(r.quantity);if(!ref||q===null)continue;let brut=q;if(r.unit==='kg MS/j')brut=q/(num(ref.ms)/100);else if(r.unit==='g/j')brut=q/1000;const dm=brut*(num(ref.ms)||0)/100;out.dm+=dm;for(const k of ['cu','zn','mn','se','co'])out[k]+=(num(ref[k])||0)*dm}return out}
function renderFeed(){const v=ensureExtendedVisit(activeVisit());if(!v){feed.innerHTML='<div class="card">Ouvrez une visite.</div>';return}const refsAll=allOvinFeedRefs(),sup=v.feed.supplement,prod=ensureOvinSettings().supplementProducts.find(x=>x.id===sup.productId),rat=rationMineralsOvin(v),dm=num(sup.dmIntake)||rat.dm||null,adds=supplementDailyOvin(prod,sup);feed.innerHTML=`<div class="card"><h2>Alimentation ovine</h2><div class="grid">${renderFormFields(v.feed,feedFields,'feed')}</div></div><div class="card"><h3>📚 Ration chiffrée / valeurs types</h3><p class="small">Utilisable même sans analyse : choisir une valeur type, ou créer un aliment dans Paramètres & seuils. Les valeurs restent marquées comme estimées.</p><div class="actions"><button class="btn" onclick="addFeedLineOvin()">+ Aliment</button><button class="btn alt" onclick="show('settings')">⚙️ Valeurs types</button></div><div class="table-wrap"><table class="compact-table feed-lines"><thead><tr><th>Lot</th><th>Aliment</th><th>Valeur type</th><th>Quantité</th><th>Unité</th><th>MS estimée</th><th></th></tr></thead><tbody>${v.feed.rationLines.map(r=>{const rf=refsAll[r.feedRefId],q=num(r.quantity),dmv=rf&&q!==null?(r.unit==='kg MS/j'?q:(r.unit==='g/j'?q/1000:q)*(num(rf.ms)||0)/100):null;return `<tr data-fr="${r.id}"><td><input data-ff="category" value="${esc(r.category||'')}"></td><td><input data-ff="name" value="${esc(r.name||'')}"></td><td><select data-ff="feedRefId"><option value="">Sans valeur type</option>${Object.entries(refsAll).map(([k,x])=>`<option value="${k}" ${r.feedRefId===k?'selected':''}>${esc(x.label)}</option>`).join('')}</select>${rf?`<div class="source-pill">${esc(rf.source||'Estimation')}</div>`:''}</td><td><input data-ff="quantity" inputmode="decimal" value="${esc(r.quantity||'')}"></td><td><select data-ff="unit">${['kg brut/j','kg MS/j','g/j'].map(x=>`<option ${r.unit===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${dmv===null?'—':dmv.toFixed(2)+' kg'}</td><td><button class="btn danger" onclick="deleteFeedLineOvin('${r.id}')">×</button></td></tr>`}).join('')||'<tr><td colspan="7">Aucun aliment chiffré.</td></tr>'}</tbody></table></div></div><div class="card"><h3>🧂 Complémentation minérale / bolus</h3><div class="supp-grid"><div class="field"><label>Catégorie</label><select id="osupcat">${OVIN_CATEGORIES.map(x=>`<option ${sup.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Ingestion MS (kg/j)</label><input id="osupdm" inputmode="decimal" value="${esc(sup.dmIntake)}" placeholder="Vide = ration calculée"></div><div class="field"><label>Produit</label><select id="osupprod"><option value="">Aucun</option>${ensureOvinSettings().supplementProducts.map(x=>`<option value="${x.id}" ${sup.productId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Dose / animal</label><div class="dose-row"><input id="osupd" inputmode="decimal" value="${esc(sup.dose)}"><select id="osupu">${['g/j','kg/j','bolus'].map(x=>`<option ${sup.doseUnit===x?'selected':''}>${x}</option>`).join('')}</select></div></div></div>${prod?'':'<div class="notice">Créez d’abord le minéral / bolus dans Paramètres & seuils.</div>'}<div class="table-wrap"><table class="compact-table"><thead><tr><th>Élément</th><th>Repère ration mg/kg MS</th><th>Besoin estimé mg/j</th><th>Ration estimée</th><th>Complément</th><th>Total</th><th>Couverture</th></tr></thead><tbody>${Object.keys(OVIN_MINERAL_TARGETS).map(k=>{const target=mineralTargetOvin(k),need=dm===null?null:target*dm,feedv=k==='i'?0:(rat[k]||0),add=adds[k]||0,total=feedv+add,cov=need?total/need*100:null;const cuRisk=k==='cu'&&dm&&total/dm>OVIN_MINERAL_MAX.cu;return `<tr><td>${OVIN_MINERAL_LABELS[k]}</td><td>${target}${k==='cu'?' <span class="small">(alerte >15)</span>':''}</td><td>${need===null?'—':need.toFixed(1)}</td><td>${k==='i'?'—':feedv.toFixed(1)}</td><td>${add.toFixed(1)}</td><td>${total.toFixed(1)}</td><td>${cov===null?'—':Math.round(cov)+' %'}${cuRisk?'<div class="badge bad">Risque cuivre ovin</div>':''}</td></tr>`}).join('')}</tbody></table></div><div class="danger-note"><b>⚠️ Spécificité ovine :</b> la tolérance au cuivre est nettement plus faible que chez les bovins. Le calcul est une aide et ne doit pas conduire à utiliser un minéral bovin chez les ovins sans validation de sa teneur en cuivre.</div></div>`;document.querySelectorAll('[data-ff]').forEach(el=>el.onchange=()=>{const r=v.feed.rationLines.find(x=>x.id===el.closest('tr').dataset.fr);r[el.dataset.ff]=el.value;saveQuiet();renderFeed()});[['osupcat','category'],['osupdm','dmIntake'],['osupprod','productId'],['osupd','dose'],['osupu','doseUnit']].forEach(([eid,k])=>document.getElementById(eid).onchange=e=>{sup[k]=e.target.value;saveQuiet();renderFeed()})}
function addFeedLineOvin(){const v=ensureExtendedVisit(activeVisit());v.feed.rationLines.push({id:id(),category:'Brebis',name:'',feedRefId:'',quantity:'',unit:'kg brut/j'});save()}
function deleteFeedLineOvin(rid){const v=ensureExtendedVisit(activeVisit());v.feed.rationLines=v.feed.rationLines.filter(r=>r.id!==rid);save()}


const OVIN_WATER_REFS={ph:{label:'pH',min:6,max:7},conductivity:{label:'Conductivité',min:200,max:1100,unit:'µS/cm'},hardness:{label:'Dureté',min:2,max:25,unit:'°f'},redox:{label:'Redox',min:0,max:350,unit:'mV'},nitrates:{label:'Nitrates',max:50,unit:'mg/L'},iron:{label:'Fer',max:200,unit:'µg/L'},manganese:{label:'Manganèse',max:50,unit:'µg/L'},ecoli:{label:'E. coli',max:0,unit:'UFC/100mL'},entero:{label:'Entérocoques',max:0,unit:'UFC/100mL'},coliforms:{label:'Coliformes totaux',max:0,unit:'UFC/100mL'},flora22:{label:'Flore 22°C',max:10,unit:'UFC/mL'},flora37:{label:'Flore 37°C',max:100,unit:'UFC/mL'}};
function owKey(n=''){n=String(n).toLowerCase();if(n.includes('ph'))return'ph';if(n.includes('conduct'))return'conductivity';if(n.includes('duret'))return'hardness';if(n.includes('redox'))return'redox';if(n.includes('nitrate'))return'nitrates';if(n.includes('fer'))return'iron';if(n.includes('mangan'))return'manganese';if(n.includes('coli'))return n.includes('coliform')?'coliforms':'ecoli';if(n.includes('entero'))return'entero';if(n.includes('22'))return'flora22';if(n.includes('36')||n.includes('37'))return'flora37';return''}function owStatus(r){const v=num(r.value),ref=OVIN_WATER_REFS[owKey(r.parameter)];if(v===null||!ref)return'à interpréter';if(ref.min!=null&&v<ref.min||ref.max!=null&&v>ref.max)return'hors repère';return'dans le repère'}
function renderWaterLabOvin(){const v=ensureExtendedVisit(activeVisit());if(!v){if(window.waterlab)waterlab.innerHTML='<div class="card">Ouvrez une visite.</div>';return}const w=v.waterLab;waterlab.innerHTML=`<div class="card"><h2>💧 Analyse d’eau ovine</h2><p class="small">Saisie des résultats Public Labos / LPL et comparaison avec les repères internes ovins/caprins. Les seuils labo restent prioritaires lorsqu’ils sont fournis.</p><div class="grid cols-4"><div class="field"><label>Laboratoire</label><select id="owlab"><option value="">Autre</option>${ensureOvinSettings().waterLabs.map(l=>`<option ${w.lab===l.name?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="owdate" type="date" value="${esc(w.date)}"></div><div class="field"><label>Origine</label><input id="owsource" value="${esc(w.source)}" placeholder="réseau, forage, source…"></div><div class="actions"><button class="btn" onclick="addWaterPointOvin('Public Labos')">+ Public Labos</button><button class="btn alt" onclick="addWaterPointOvin('LPL')">+ LPL</button></div></div></div><div class="card"><h3>Points de prélèvement</h3>${w.points.map(pt=>`<div class="card" data-owpt="${pt.id}"><div class="header-row"><input data-owpf="name" value="${esc(pt.name||'Point eau')}"><button class="btn danger" onclick="deleteWaterPointOvin('${pt.id}')">Supprimer</button></div><div class="table-wrap"><table class="compact-table"><thead><tr><th>Paramètre</th><th>Résultat</th><th>Unité</th><th>Lecture</th></tr></thead><tbody>${pt.rows.map(r=>`<tr data-owr="${r.id}"><td><input data-owrf="parameter" value="${esc(r.parameter)}"></td><td><input data-owrf="value" value="${esc(r.value)}"></td><td><input data-owrf="unit" value="${esc(r.unit)}"></td><td>${owStatus(r)}</td></tr>`).join('')}</tbody></table></div></div>`).join('')||'<div class="small">Aucun point.</div>'}<div class="field"><label>Conclusion</label><textarea id="ownotes">${esc(w.notes)}</textarea></div></div>`;ow let deferredInstallPrompt=null;
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true}
function refreshInstallButton(){
  const b=document.getElementById('installAppBtn');if(!b)return;
  if(isStandalone()){b.classList.add('hidden');return}
  if(deferredInstallPrompt){b.classList.remove('hidden');b.textContent='⬇ Installer'}
  else {b.classList.remove('hidden');b.textContent='⬇ Installation'}
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredInstallPrompt=e;refreshInstallButton();
});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;refreshInstallButton();});
async function installApp(){
  if(isStandalone())return;
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice}catch(e){}
    deferredInstallPrompt=null;refreshInstallButton();return;
  }
  const box=document.getElementById('installHelp'),txt=document.getElementById('installHelpText');
  if(box&&txt){
    txt.innerHTML='<p>Chrome ne propose pas encore l’installation pour cette page.</p><p><b>À faire une seule fois :</b> ferme complètement cet onglet, rouvre Audit Ovin depuis Chrome, puis actualise la page. Le bouton passera automatiquement à <b>⬇ Installer</b> dès que Chrome reconnaît l’application.</p><p>Si le menu Chrome affiche seulement « créer un raccourci », ne le choisis pas : ce serait à nouveau un simple raccourci avec le logo Chrome.</p>';
    box.classList.remove('hidden');
  }
}

function initKeyboardDismissButton(){
  let b=document.createElement('button');
  b.id='keyboard-dismiss';b.className='keyboard-dismiss';b.type='button';b.innerHTML='⌄ <span>Clavier</span>';
  document.body.appendChild(b);
  const editable=e=>e&&e.matches&&e.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select');
  const update=()=>b.classList.toggle('visible',editable(document.activeElement));
  document.addEventListener('focusin',()=>setTimeout(update,0));
  document.addEventListener('focusout',()=>setTimeout(()=>{update();finishEditing()},130));
  b.addEventListener('pointerdown',e=>e.preventDefault());
  b.onclick=()=>{let e=document.activeElement;if(editable(e)){e.dispatchEvent(new Event('change',{bubbles:true}));e.blur()}b.classList.remove('visible')};
  if(window.visualViewport)window.visualViewport.addEventListener('resize',update);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target && e.target.matches('[data-measure-input]')){
    e.preventDefault();
    const inputs=[...document.querySelectorAll('[data-measure-input]')];
    const i=inputs.indexOf(e.target);
    e.target.dispatchEvent(new Event('input',{bubbles:true}));
    if(i>=0 && i<inputs.length-1){inputs[i+1].focus();inputs[i+1].select?.()}
    else e.target.blur();
  }
});

v class="card"><div class="actions" style="justify-content:space-between"><h3>Analyses / factures</h3><button class="btn" onclick="addOTest()">+ Ajouter une analyse</button></div><div class="table-wrap"><table class="compact-table"><thead><tr><th>Type</th><th>Labo</th><th>Résultat reçu</th><th>Facture reçue</th><th>Coût €</th><th>Justificatif</th></tr></thead><tbody>${s.tests.map(x=>`<tr data-ot="${x.id}"><td><input data-f="type" value="${esc(x.type)}"></td><td><input data-f="lab" value="${esc(x.lab)}"></td><td><input type="date" data-f="received" value="${esc(x.received||'')}"></td><td><input type="checkbox" data-f="invoice" ${x.invoice?'checked':''}></td><td><input data-f="cost" value="${esc(x.cost||'')}"></td><td><input data-f="doc" value="${esc(x.doc||'')}"></td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="actions" style="justify-content:space-between"><h3>Modifications éleveur</h3><button class="btn" onclick="addOChange()">+ Ajouter une modification</button></div>${s.changes.map(x=>`<div class="grid" data-oc="${x.id}"><input data-f="action" value="${esc(x.action)}" placeholder="Action"><input data-f="cost" value="${esc(x.cost)}" placeholder="Coût €"><input data-f="benefit" value="${esc(x.benefit)}" placeholder="Bénéfice estimé / mesuré €"></div>`).join('')||'<span class="small">Aucune modification renseignée.</span>'}</div>`;document.querySelectorAll('[data-oa],[data-ot],[data-oc]').forEach(r=>{const arr=r.dataset.oa?s.attendees:r.dataset.ot?s.tests:s.changes,obj=arr.find(x=>x.id===(r.dataset.oa||r.dataset.ot||r.dataset.oc));r.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{obj[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;saveLocalOnly()})});document.querySelectorAll('[data-ogt]').forEach(el=>el.onchange=()=>{gt[el.dataset.ogt]=el.value;saveLocalOnly();renderStudyOvin()})}

function renderEconomyOvin(){if(!window.economy)return;const v=activeVisit(),f=activeFarm();if(!v||!f){economy.innerHTML='<div class="card">Ouvrez une visite.</div>';return}const p=ensureOvinEco(f);v.ecoManual=v.ecoManual||{};const m=v.ecoManual;const n=x=>Number(String(x||0).replace(',','.'))||0;let rows=[];const add=(l,g,fo)=>g&&rows.push([l,g,fo]);add('Mortalité agneaux',n(m.lambDeathsAvoided)*p.lambPrice,`${n(m.lambDeathsAvoided)} agneau(x) × ${p.lambPrice} €`);add('Mortalité adultes',n(m.adultDeathsAvoided)*p.adultDeathCost,`${n(m.adultDeathsAvoided)} × ${p.adultDeathCost} €`);add('Avortements évités',n(m.abortionsAvoided)*p.abortionCost,`${n(m.abortionsAvoided)} × ${p.abortionCost} €`);add('Lait supplémentaire',n(m.extraMilk)*p.milkPrice,`${n(m.extraMilk)} L × ${p.milkPrice} €`);add('GMQ / poids supplémentaire',n(m.extraKg)*p.liveKgPrice,`${n(m.extraKg)} kg × ${p.liveKgPrice} €`);add('Vente plus précoce',n(m.saleDays)*n(m.saleLambs)*p.feedDayLamb,`${n(m.saleLambs)} agneaux × ${n(m.saleDays)} j × ${p.feedDayLamb} €`);const total=rows.reduce((s,x)=>s+x[1],0);economy.innerHTML=`<div class="card"><h2>💶 Marge de progrès économique ovine</h2><div class="grid">${Object.entries(p).map(([k,val])=>`<div class="field"><label>${ecoOvinLabels[k]||k}</label><input data-op="${k}" value="${val}"></div>`).join('')}</div></div><div class="card"><h3>Hypothèses / résultats</h3><div class="grid">${[['lambDeathsAvoided','Mortalités agneaux évitées'],['adultDeathsAvoided','Décès adultes évités'],['abortionsAvoided','Avortements évités'],['extraMilk','Lait supplémentaire L'],['extraKg','Kg viande/vif supplémentaires'],['saleLambs','Nb agneaux vendus plus tôt'],['saleDays','Jours gagnés']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-om="${k}" value="${esc(m[k]||'')}"></div>`).join('')}</div></div><div class="card"><h3>Gain théorique</h3>${rows.map(x=>`<p><b>${esc(x[0])}</b> — ${esc(x[2])} = <b>+${Math.round(x[1])} €</b></p>`).join('')||'<span class="small">Renseign
