<style>
:root{--g:#315b47;--g2:#e8f2ed;--bg:#f5f6f4;--card:#fff;--txt:#1f2b25;--muted:#65736b;--line:#d8dfdb;--ok:#dff3e4;--warn:#fff1c7;--bad:#f8d7da;--blue:#e6efff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}header{position:sticky;top:0;z-index:5;background:var(--g);color:white;padding:14px 16px;box-shadow:0 2px 8px #0002}.brand{font-size:19px;font-weight:800}.sub{font-size:12px;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:12px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tabs button{white-space:nowrap;border:0;border-radius:999px;padding:10px 14px;background:white;color:var(--g);font-weight:700;box-shadow:0 1px 4px #0001}.tabs button.active{background:var(--g);color:white}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 7px #0000000b}.card h2,.card h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #bdc8c1;border-radius:9px;padding:10px;background:#fff;font-size:15px}.field textarea{min-height:76px}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:white;font-weight:750}.btn.alt{background:#edf2ef;color:var(--g);border:1px solid #b9c8c0}.btn.danger{background:#9b2f35}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.ok{background:var(--ok);color:#17622c}.warn{background:var(--warn);color:#795b00}.bad{background:var(--bad);color:#8a2630}.info{background:var(--blue);color:#285596}.subject{border-left:5px solid var(--g);padding-left:12px}.measure-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.measure{border:1px solid var(--line);border-radius:10px;padding:8px}.measure label{display:block;font-size:12px;font-weight:700;color:var(--muted)}.measure input,.measure select{width:100%;margin-top:4px;border:1px solid #c6cec9;border-radius:8px;padding:8px}.result{margin-top:5px;font-size:12px}.list-item{border-bottom:1px solid var(--line);padding:10px 0}.list-item:last-child{border:0}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--g2);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px}.small{font-size:12px;color:var(--muted)}.notice{background:#fff7dc;border:1px solid #eed28a;border-radius:12px;padding:10px}.hidden{display:none}@media(max-width:620px){.wrap{padding:8px}.card{padding:11px}.kpis{grid-template-columns:1fr}.measure-grid{grid-template-columns:repeat(2,1fr)}}@media print{header,.tabs,.no-print{display:none!important}.panel{display:block!important}.card{break-inside:avoid;box-shadow:none}}

.header-user button{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:8px;padding:5px 8px;font-weight:700}

</style>

<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🐑 Audit Ovin GDS 32-65</h1>

  <div class="header-row">
    <div><div class="brand">🐑 Audit Ovin GDS 32-65</div><div class="sub" id="activeVisit">Aucune visite active</div><div class="sub" id="cloudStatus">☁️ Supabase à configurer</div></div>
    <div id="userBox" class="header-user hidden"><span id="userBadge"></span><button onclick="signOut()">Déconnexion</button></div>

<section id="measurements" class="panel"></section>
<section id="flock" class="panel"></section>
<section id="feed" class="panel"></section>
<section id="building" class="panel"></section>

</div>
<script>
const APP='auditOvinGDS_v1';
const APP_VERSION='1.3';
const DEFAULT_SUPABASE_URL='https://ckylznynqsefqkmtjcjf.supabase.co';
const CLOUD_ID='audit-ovin-main';
let cloudTimer=null, cloudBusy=false;
let authSession=JSON.parse(localStorage.getItem('auditOvin.authSession')||'null');
let currentProfile=null;
function cloudCfg(){return {url:(localStorage.getItem('auditOvin.supabaseUrl')||localStorage.getItem('parage.supabaseUrl')||DEFAULT_SUPABASE_URL).replace(/\/rest\/v1\/?$/,'').replace(/\/$/,''),key:localStorage.getItem('auditOvin.supabaseKey')||localStorage.getItem('parage.supabaseKey')||''}}
function setCloudStatus(txt){let e=document.getElementById('cloudStatus');if(e)e.textContent=txt}
function authHeaders(extra={}){let c=cloudCfg();return Object.assign({'apikey':c.key,'Content-Type':'application/json'},authSession?.access_token?{'Authorization':'Bearer '+authSession.access_token}:{},extra)}
async function supa(path,opt={}){let c=cloudCfg();if(!c.key)throw new Error('Clé publique Supabase non renseignée');if(!authSession?.access_token)throw new Error('Utilisateur non connecté');let h=Object.assign(authHeaders(),opt.headers||{});let r=await fetch(c.url+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(r.status===401&&await refreshAuthSession()){h=Object.assign(authHeaders(),opt.headers||{});r=await fetch(c.url+'/rest/v1/'+path,Object.assign({},opt,{headers:h}))}return r}

function saveLoginCloudConfig(){
  let u=(document.getElementById('loginSupaUrl').value||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
  let k=(document.getElementById('loginSupaKey').value||'').trim();
  if(!u||!k){document.getElementById('loginMessage').textContent='Renseignez l’URL et la clé publique.';return}
  localStorage.setItem('auditOvin.supabaseUrl',u);localStorage.setItem('auditOvin.supabaseKey',k);
  document.getElementById('loginMessage').textContent='Configuration Supabase enregistrée.';
}
async function signIn(){
  let email=(document.getElementById('loginEmail').value||'').trim(),password=document.getElementById('loginPassword').value||'',c=cloudCfg();
  if(!c.key){document.getElementById('loginMessage').textContent='Configurez d’abord la clé publique Supabase.';return}
  if(!email||!password){document.getElementById('loginMessage').textContent='Saisissez l’e-mail et le mot de passe.';return}
  document.getElementById('loginMessage').textContent='Connexion…';
  try{
    let r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    let data=await r.json();if(!r.ok)throw new Error(data.error_description||data.msg||'Connexion refusée');
    authSession=data;localStorage.setItem('auditOvin.authSession',JSON.stringify(data));
    await loadCurrentProfile();enterApplication();
  }catch(e){document.getElementById('loginMessage').textContent=e.message||'Erreur de connexion'}
}
async function refreshAuthSession(){
  if(!authSession?.refresh_token)return false;let c=cloudCfg();if(!c.key)return false;
  try{let r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:authSession.refresh_token})});if(!r.ok)return false;authSession=await r.json();localStorage.setItem('auditOvin.authSession',JSON.stringify(authSession));return true}catch{return false}
}
async function loadCurrentProfile(){
  let c=cloudCfg();let r=await fetch(c.url+'/rest/v1/profiles?id=eq.'+encodeURIComponent(authSession.user.id)+'&select=id,email,display_name,role,active',{headers:authHeaders()});
  if(r.status===401&&await refreshAuthSession())return loadCurrentProfile();
  if(!r.ok)throw new Error('Profil utilisateur introuvable.');
  let rows=await r.json();if(!rows.length)throw new Error('Aucun profil associé à ce compte.');
  currentProfile=rows[0];if(currentProfile.active===false)throw new Error('Ce compte a été désactivé.');
}
function enterApplication(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('userBox').classList.remove('hidden');
  document.getElementById('userBadge').textContent=(currentProfile.display_name||currentProfile.email)+' · '+(currentProfile.role||'technicien');
  setCloudStatus('☁️ Connecté');
  cloudRestoreSilent();
}
async function signOut(){
  try{let c=cloudCfg();await fetch(c.url+'/auth/v1/logout',{method:'POST',headers:authHeaders()})}catch{}
  authSession=null;currentProfile=null;localStorage.removeItem('auditOvin.authSession');location.reload();
}
async function cloudRestoreSilent(){
  try{
    let r=await supa('ovin_backups?id=eq.'+encodeURIComponent(CLOUD_ID)+'&select=payload,updated_at',{method:'GET'});
    if(!r.ok)return;let rows=await r.json();
    if(rows.length&&rows[0].payload){db=rows[0].payload;localStorage.setItem(APP,JSON.stringify(db));renderAll();setCloudStatus('☁️ Cloud à jour')}
  }catch(e){console.warn('Restauration silencieuse impossible',e)}
}
async function initAuth(){
  let c=cloudCfg();
  document.getElementById('loginSupaUrl').value=c.url;
  document.getElementById('loginSupaKey').value=c.key;
  if(!c.key){document.getElementById('loginMessage').textContent='Configurez la clé publique Supabase une fois sur cet appareil.';return}
  if(authSession?.access_token){
    try{await loadCurrentProfile();enterApplication();return}catch(e){
      if(await refreshAuthSession()){try{await loadCurrentProfile();enterApplication();return}catch{}}
      authSession=null;localStorage.removeItem('auditOvin.authSession');
    }
  }
}
function scheduleCloudSync(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudBackup(false),1200)}
async function cloudBackup(showMessage=true){if(cloudBusy)return false;let c=cloudCfg();if(!c.key){setCloudStatus('☁️ Supabase à configurer');if(showMessage)alert('Renseignez la clé publique Supabase dans Sauvegarde.');return false}cloudBusy=true;setCloudStatus('☁️ Synchronisation…');try{let payload={id:CLOUD_ID,payload:db,updated_at:new Date().toISOString()};let r=await supa('ovin_backups?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());localStorage.setItem('auditOvin.lastSync',new Date().toISOString());setCloudStatus('☁️ Cloud à jour');if(showMessage)alert('Sauvegarde Supabase effectuée.');return true}catch(e){console.error(e);setCloudStatus('☁️ En attente d’envoi');if(showMessage)alert('Synchronisation impossible : '+e.message);return false}finally{cloudBusy=false}}
async function cloudRestore(){let c=cloudCfg();if(!c.key)return alert('Renseignez d’abord la clé publique Supabase.');if(!confirm('Restaurer les données Ovin depuis Supabase ? Les données locales seront remplacées par la sauvegarde cloud.'))return;setCloudStatus('☁️ Restauration…');try{let r=await supa('ovin_backups?id=eq.'+encodeURIComponent(CLOUD_ID)+'&select=payload,updated_at',{method:'GET'});if(!r.ok)throw new Error(await r.text());let rows=await r.json();if(!rows.length)return alert('Aucune sauvegarde Ovin trouvée dans Supabase.');db=rows[0].payload;localStorage.setItem(APP,JSON.stringify(db));renderAll();setCloudStatus('☁️ Cloud restauré');alert('Restauration terminée.')}catch(e){setCloudStatus('☁️ Erreur cloud');alert('Restauration impossible : '+e.message)}}
function saveCloudConfig(){let u=(document.getElementById('supaUrl').value||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');let k=(document.getElementById('supaKey').value||'').trim();localStorage.setItem('auditOvin.supabaseUrl',u||DEFAULT_SUPABASE_URL);localStorage.setItem('auditOvin.supabaseKey',k);if(document.getElementById('loginSupaUrl'))document.getElementById('loginSupaUrl').value=u||DEFAULT_SUPABASE_URL;if(document.getElementById('loginSupaKey'))document.getElementById('loginSupaKey').value=k;renderBackup();if(k){setCloudStatus('☁️ Prêt à synchroniser');cloudBackup(false)}else setCloudStatus('☁️ Supabase à configurer')}
async function testCloud(){let c=cloudCfg();if(!c.key)return alert('Renseignez la clé publique Supabase.');try{let r=await supa('ovin_backups?select=id&limit=1',{method:'GET'});if(!r.ok)throw new Error(await r.text());setCloudStatus('☁️ Connexion Supabase OK');alert('Connexion Supabase Ovin OK.')}catch(e){setCloudStatus('☁️ Erreur Supabase');alert('Connexion impossible : '+e.message)}}
const tabs=[['home','Accueil'],['farm','Exploitation'],['visits','Visites'],['subjects','Sujets / lots'],['measurements','Mesures'],['flock','Audit troupeau'],['feed','Alimentation'],['building','Bâtiment / eau'],['analysis','Analyse'],['actions','Plan d’action'],['report','Rapport'],['backup','Sauvegarde']];
const stages=['Brebis en lactation','Brebis taries','Préparation mise-bas','Agneaux naissance','Agneaux J+1'];
const refs={
'Brebis en lactation':{nec:[2.5,2.75],muscle:[1.5,2],srr:[3.5,4],urineColor:[1,2],urinePH:[7.8,8.3],urineRedox:[-20,20],urineBrix:[3,5],urineDensity:[1015,1030],gly:[58,75],boh:[0,0.7],bloodPH:[7.34,7.45],fecesPH:[6.5,6.8],fecesRedox:[-200,-180],temp:[39.5,40]},
'Brebis taries':{nec:[2.75,3],muscle:[2,3],srr:[3.5,4],urineColor:[1,2],urinePH:[7.8,8.3],urineRedox:[-20,20],urineBrix:[3,5],urineDensity:[1015,1030],gly:[58,75],boh:[0,0.4],bloodPH:[7.34,7.45],fecesPH:[6.5,6.8],fecesRedox:[-200,-180],temp:[38.5,39.5]},
'Préparation mise-bas':{nec:[2.75,3],muscle:[2,3],srr:[3.5,4],urineColor:[1,2],urinePH:[7.8,8.3],urineRedox:[-20,20],urineBrix:[3,5],urineDensity:[1015,1030],gly:[58,75],boh:[0,1.2],bloodPH:[7.34,7.45],urea:[0.25,0.3],fecesPH:[6.5,6.8],fecesRedox:[-200,-180],temp:[39.5,40]},
'Agneaux naissance':{nec:[3,3],muscle:[2,3],limbs:[1,1.5],urineColor:[1,2],urinePH:[6,7],urineRedox:[-100,0],urineBrix:[0,2],urineDensity:[1015,1025],gly:[36,66],boh:[0,0.4],bloodPH:[7.34,7.45],protein:[65,999],fecesPH:[6.5,6.8],temp:[39,39.5]},
'Agneaux J+1':{nec:[3,3],muscle:[2,3],limbs:[1,1.5],urineColor:[1,2],urinePH:[6,7],urineRedox:[-100,0],urineBrix:[0,2],urineDensity:[1015,1025],gly:[80,120],boh:[0,0.2],bloodPH:[7.34,7.45],protein:[65,999],fecesPH:[6.5,6.8],temp:[39,39.5]}
};
const measureLabels={nec:'NEC',muscle:'Muscle',srr:'SRR',limbs:'Membres',urineColor:'Couleur urine',urinePH:'pH urine',urineRedox:'Redox urine',urineBrix:'Brix urine (%)',urineDensity:'Densité urine',gly:'Glycémie',boh:'BOH',bloodPH:'pH sang',urea:'Urémie',protein:'Protéines totales',fecesPH:'pH selles',fecesRedox:'Redox selles',temp:'Température'};
let db=JSON.parse(localStorage.getItem(APP)||'{"farms":[],"visits":[],"subjects":[],"activeVisitId":null}');
const save=()=>{localStorage.setItem(APP,JSON.stringify(db));renderAll();scheduleCloudSync()};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const activeVisit=()=>db.visits.find(v=>v.id===db.activeVisitId);
const activeFarm=()=>{let v=activeVisit();return v&&db.farms.find(f=>f.id===v.farmId)};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function initTabs(){tabs.forEach(([k,l])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>show(k);b.dataset.tab=k;document.querySelector('#tabs').appendChild(b)});show('home')}
function show(k){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===k));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===k));window.scrollTo(0,0)}
function renderAll(){let v=activeVisit(),f=activeFarm();document.querySelector('#activeVisit').textContent=v?`${f?.name||''} • ${v.date} • ${v.type}`:'Aucune visite active';renderHome();renderFarm();renderVisits();renderSubjects();renderMeasurements();renderFlock();renderFeed();renderBuilding();renderAnalysis();renderActions();renderReport();renderBackup()}
function renderHome(){let v=activeVisit(), subs=v?db.subjects.filter(s=>s.visitId===v.id):[];home.innerHTML=`<div class="card"><h2>Audit ovin de terrain</h2><p>Application autonome de terrain : aucune base métier ni aucun fichier d'import n'est nécessaire. Les exploitations, lots et sujets sont saisis directement dans l'application.</p><div class="kpis"><div class="kpi"><b>${db.farms.length}</b><span>exploitations</span></div><div class="kpi"><b>${db.visits.length}</b><span>visites</span></div><div class="kpi"><b>${subs.length}</b><span>sujets / lots actifs</span></div></div></div><div class="card notice"><b>Fonctionnement Ovin</b><br>Pas de base métier, pas d'import CSV et pas de module de reproduction détaillé. Saisir l'exploitation, créer la visite, puis ajouter uniquement les lots ou animaux réellement observés.</div><div class="card notice"><b>Ordre conseillé</b><br>Exploitation → Visite → Sujets/lots → Mesures → Audit troupeau → Analyse → Plan d’action → Rapport.</div><div class="card"><h3>Types de visite</h3><div class="grid"><div>• Bilan troupeau</div><div>• Préparation agnelage</div><div>• Suivi agneaux</div><div>• Diagnostic sanitaire</div><div>• Alimentation</div><div>• Bâtiment et eau</div></div></div>`}
function renderFarm(){farm.innerHTML=`<div class="card"><h2>Nouvelle exploitation</h2><div class="grid"><div class="field"><label>Nom exploitation</label><input id="fn"></div><div class="field"><label>Éleveur</label><input id="fo"></div><div class="field"><label>N° EDE</label><input id="fede"></div><div class="field"><label>Commune</label><input id="fc"></div><div class="field"><label>Type</label><select id="ft"><option>Ovin allaitant</option><option>Ovin laitier</option><option>Mixte</option></select></div><div class="field"><label>Conduite</label><select id="fcond"><option>Bergerie</option><option>Plein air</option><option>Mixte</option><option>Transhumance</option></select></div></div><div class="field"><label>Informations permanentes</label><textarea id="fnotes"></textarea></div><button class="btn" onclick="addFarm()">Enregistrer</button></div><div class="card"><h3>Exploitations</h3>${db.farms.map(f=>`<div class="list-item"><b>${esc(f.name)}</b> <span class="small">${esc(f.ede||'')} • ${esc(f.type)}</span><br><span class="small">${esc(f.owner||'')} – ${esc(f.commune||'')}</span></div>`).join('')||'<span class="small">Aucune exploitation.</span>'}</div>`}
function addFarm(){if(!fn.value.trim())return alert('Nom obligatoire');db.farms.push({id:id(),name:fn.value.trim(),owner:fo.value,ede:fede.value,commune:fc.value,type:ft.value,conduct:fcond.value,notes:fnotes.value});save()}
function renderVisits(){visits.innerHTML=`<div class="card"><h2>Créer une visite</h2><div class="grid"><div class="field"><label>Exploitation</label><select id="vf">${db.farms.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="vd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Type</label><select id="vt"><option>Bilan troupeau</option><option>Préparation agnelage</option><option>Suivi agneaux</option><option>Diagnostic sanitaire</option><option>Alimentation</option><option>Bâtiment et eau</option><option>Visite ciblée</option></select></div><div class="field"><label>Technicien</label><input id="vtech"></div></div><button class="btn" onclick="addVisit()">Créer et ouvrir</button></div><div class="card"><h3>Historique</h3>${db.visits.slice().reverse().map(v=>{let f=db.farms.find(x=>x.id===v.farmId);return `<div class="list-item"><b>${esc(f?.name||'')}</b> — ${v.date}<br><span class="small">${esc(v.type)} • ${esc(v.tech||'')}</span><div class="actions"><button class="btn alt" onclick="openVisit('${v.id}')">Ouvrir</button></div></div>`}).join('')||'<span class="small">Aucune visite.</span>'}</div>`}
function addVisit(){if(!vf.value)return alert('Créer une exploitation');let v={id:id(),farmId:vf.value,date:vd.value,type:vt.value,tech:vtech.value,flock:{},feed:{},building:{},water:{},actions:[],conclusion:''};db.visits.push(v);db.activeVisitId=v.id;save()}
function openVisit(x){db.activeVisitId=x;save()}
function renderSubjects(){let v=activeVisit();if(!v){subjects.innerHTML='<div class="card">Ouvrez une visite.</div>';return}let ss=db.subjects.filter(s=>s.visitId===v.id);subjects.innerHTML=`<div class="card"><h2>Ajouter manuellement un sujet ou un lot</h2><p class="small">Aucun import n'est attendu : vous pouvez saisir un animal repéré individuellement ou un lot représentatif.</p><div class="grid"><div class="field"><label>Identifiant / lot</label><input id="sid"></div><div class="field"><label>Stade</label><select id="sst">${stages.map(x=>`<option>${x}</option>`)}</select></div><div class="field"><label>Âge / jours de lactation</label><input id="sage"></div><div class="field"><label>Effectif représenté</label><input id="scount" type="number" value="1"></div></div><div class="field"><label>Observation</label><textarea id="snote"></textarea></div><button class="btn" onclick="addSubject()">Ajouter</button></div><div class="card"><h3>Sujets et lots</h3>${ss.map(s=>`<div class="list-item subject"><b>${esc(s.name)}</b> <span class="badge info">${esc(s.stage)}</span><br><span class="small">${esc(s.age||'')} • effectif ${s.count||1}</span></div>`).join('')||'<span class="small">Aucun sujet.</span>'}</div>`}
function addSubject(){if(!sid.value.trim())return alert('Identifiant obligatoire');db.subjects.push({id:id(),visitId:db.activeVisitId,name:sid.value.trim(),stage:sst.value,age:sage.value,count:+scount.value||1,note:snote.value,measures:{},observations:{}});save()}
function classify(key,val,stage){if(val===''||val==null)return '';let n=Number(String(val).replace(',','.'));if(Number.isNaN(n))return '<span class="badge info">à interpréter</span>';let r=refs[stage]?.[key];if(!r)return '<span class="badge info">sans seuil</span>';if(n<r[0])return '<span class="badge bad">bas</span>';if(n>r[1])return '<span class="badge warn">haut</span>';return '<span class="badge ok">référence</span>'}
function renderMeasurements(){let v=activeVisit();if(!v){measurements.innerHTML='<div class="card">Ouvrez une visite.</div>';return}let ss=db.subjects.filter(s=>s.visitId===v.id);measurements.innerHTML=`<div class="card"><h2>Mesures individuelles ou par lot</h2><p class="small">La couleur est calculée selon le stade choisi.</p></div>${ss.map(s=>`<div class="card"><h3>${esc(s.name)} <span class="badge info">${esc(s.stage)}</span></h3><div class="measure-grid">${Object.entries(measureLabels).map(([k,l])=>`<div class="measure"><label>${l}</label><input inputmode="decimal" value="${esc(s.measures[k]??'')}" onchange="setMeasure('${s.id}','${k}',this.value)"><div class="result">${classify(k,s.measures[k],s.stage)}</div></div>`).join('')}</div><h4>Observations cliniques</h4><div class="grid">${['Palpation rumen','Selles','Membres / boiterie','Mamelle / trayons','Laine','Muqueuses / FAMACHA','Nombril','Thyroïde / larynx','Cœur / poumons','Réflexe de succion / vitalité'].map(x=>`<div class="field"><label>${x}</label><select onchange="setObs('${s.id}','${x}',this.value)"><option></option><option ${s.observations[x]==='RAS'?'selected':''}>RAS</option><option ${s.observations[x]==='À surveiller'?'selected':''}>À surveiller</option><option ${s.observations[x]==='Anormal'?'selected':''}>Anormal</option><option ${s.observations[x]==='Non évalué'?'selected':''}>Non évalué</option></select></div>`).join('')}</div></div>`).join('')||'<div class="card">Ajoutez au moins un sujet ou lot.</div>'}`}
function setMeasure(sid,k,v){let s=db.subjects.find(x=>x.id===sid);s.measures[k]=v;save()}function setObs(sid,k,v){let s=db.subjects.find(x=>x.id===sid);s.observations[k]=v;save()}
const flockFields=[['system','Système de production','select',['Allaitant','Laitier','Mixte']],['breed','Race(s)','text'],['ewes','Nombre de brebis','number'],['eweLambs','Nombre d’agnelles de renouvellement','number'],['rams','Nombre de béliers','number'],['lambs','Nombre d’agneaux présents','number'],['lambing','Période(s) d’agnelage','text'],['fertility','Fertilité (%) si connue','number'],['prolificacy','Prolificité si connue','number'],['mortBirth','Mortalité naissance (%) si connue','number'],['mortWean','Mortalité avant sevrage (%) si connue','number'],['abortions','Avortements / épisodes abortifs','textarea'],['parasites','Parasitisme / coproscopies','textarea'],['feet','Boiteries / parage','textarea'],['mastitis','Mammites / mamelles','textarea'],['biosecurity','Biosécurité / introductions','textarea'],['welfare','Bien-être / contention / prédation','textarea']];
function renderFormFields(obj,arr,prefix){return arr.map(([k,l,t,opts])=>`<div class="field"><label>${l}</label>${t==='select'?`<select onchange="setVisitObj('${prefix}','${k}',this.value)"><option></option>${opts.map(o=>`<option ${obj[k]===o?'selected':''}>${o}</option>`).join('')}</select>`:t==='textarea'?`<textarea onchange="setVisitObj('${prefix}','${k}',this.value)">${esc(obj[k]||'')}</textarea>`:`<input type="${t}" value="${esc(obj[k]||'')}" onchange="setVisitObj('${prefix}','${k}',this.value)">`}</div>`).join('')}
function renderFlock(){let v=activeVisit();flock.innerHTML=v?`<div class="card"><h2>Audit troupeau ovin</h2><p class="small">Les données sont saisies manuellement à partir des informations disponibles chez l'éleveur. Les indicateurs de reproduction sont facultatifs et restent volontairement synthétiques.</p><div class="grid">${renderFormFields(v.flock,flockFields,'flock')}</div></div>`:'<div class="card">Ouvrez une visite.</div>'}
const feedFields=[['ration','Ration par lot','textarea'],['forages','Fourrages et qualité','textarea'],['concentrates','Concentrés / céréales','textarea'],['minerals','Minéraux / vitamines','textarea'],['transitions','Transitions alimentaires','textarea'],['sorting','Tri / refus / accès auge','textarea'],['baca','BACA en préparation MB','textarea'],['energyProtein','Équilibre énergie / protéines','textarea'],['colostrumPlan','Plan colostral','textarea']];
function renderFeed(){let v=activeVisit();feed.innerHTML=v?`<div class="card"><h2>Alimentation</h2><div class="grid">${renderFormFields(v.feed,feedFields,'feed')}</div></div>`:'<div class="card">Ouvrez une visite.</div>'}
const buildFields=[['housing','Type de logement','text'],['density','Densité / surface','text'],['litter','Litière / humidité','textarea'],['ventilation','Ventilation / courants d’air','textarea'],['lambingPens','Cases d’agnelage','textarea'],['nursery','Zone agneaux / lampes / température','textarea'],['feedingSpace','Places à l’auge','text'],['waterPoints','Nombre et accessibilité abreuvoirs','textarea'],['electric','Courants parasites / mV','textarea'],['hygiene','Nettoyage / désinfection / vide sanitaire','textarea']];
const waterFields=[['source','Origine eau','text'],['mv','Électricité mV','number'],['hardness','Dureté °f','number'],['chlorine','Chloration','number'],['conductivity','Conductivité','number'],['tds','TDS','number'],['salinity','Salinité','number'],['ph','pH','number'],['redox','Redox','number']];
function renderBuilding(){let v=activeVisit();building.innerHTML=v?`<div class="card"><h2>Bâtiment</h2><div class="grid">${renderFormFields(v.building,buildFields,'building')}</div></div><div class="card"><h2>Eau</h2><div class="grid">${renderFormFields(v.water,waterFields,'water')}</div><div class="notice small">Repères intégrés du fichier : pH conseillé 6–7 ; conductivité &lt;200 ; TDS &lt;500 ; salinité &lt;1000 ; chloration &lt;0,1 ; dureté 5–25 °f.</div></div>`:'<div class="card">Ouvrez une visite.</div>'}
function setVisitObj(obj,k,val){let v=activeVisit();v[obj][k]=val;save()}
function getFindings(){let v=activeVisit();if(!v)return[];let ss=db.subjects.filter(s=>s.visitId===v.id),out=[];ss.forEach(s=>{Object.entries(s.measures).forEach(([k,val])=>{let r=refs[s.stage]?.[k],n=Number(String(val).replace(',','.'));if(r&&!Number.isNaN(n)&&(n<r[0]||n>r[1]))out.push({level:n<r[0]?'bas':'haut',subject:s.name,text:`${measureLabels[k]} ${n<r[0]?'bas':'haut'} (${val}) chez ${s.stage}`})});Object.entries(s.observations).forEach(([k,val])=>{if(val==='Anormal'||val==='À surveiller')out.push({level:val==='Anormal'?'anormal':'surveillance',subject:s.name,text:`${k} : ${val}`})})});if(v.flock.mortBirth>10)out.push({level:'anormal',text:'Mortalité à la naissance élevée : vérifier agnelage, vitalité, hypothermie et prise colostrale.'});if(v.flock.abortions)out.push({level:'surveillance',text:'Avortements renseignés : documenter le taux, les lots, les dates et le protocole diagnostique.'});return out}
function renderAnalysis(){let fs=getFindings();analysis.innerHTML=`<div class="card"><h2>Analyse automatique</h2><p class="small">Pistes de travail à relire par le technicien ; elles ne constituent pas un diagnostic.</p>${fs.map(x=>`<div class="list-item"><span class="badge ${x.level==='anormal'?'bad':'warn'}">${x.level}</span> ${esc(x.text)}</div>`).join('')||'<div class="badge ok">Aucun écart automatique détecté dans les données saisies.</div>'}</div><div class="card"><h3>Raisonnements ovins à croiser</h3><div class="grid"><div><b>Préparation mise-bas</b><br><span class="small">NEC, glycémie, BOH, BACA, ingestion, taille de portée, toxémie.</span></div><div><b>Agneaux</b><br><span class="small">Vitalité, température, glycémie, protéines totales, colostrum, nombril.</span></div><div><b>Parasitisme</b><br><span class="small">FAMACHA, NEC, diarrhée, coproscopies, dynamique de lot.</span></div><div><b>Boiteries</b><br><span class="small">Score locomotion, lésions, sols, humidité, parage et contagion.</span></div></div></div>`}
function renderActions(){let v=activeVisit();if(!v){actions.innerHTML='<div class="card">Ouvrez une visite.</div>';return}actions.innerHTML=`<div class="card"><h2>Ajouter une action</h2><div class="grid"><div class="field"><label>Thème</label><select id="atheme"><option>Alimentation</option><option>Agnelage / colostrum</option><option>Parasitisme</option><option>Boiteries</option><option>Bâtiment</option><option>Eau</option><option>Sanitaire</option></select></div><div class="field"><label>Priorité</label><select id="ap"><option>Haute</option><option>Moyenne</option><option>Basse</option></select></div><div class="field"><label>Échéance</label><input id="ad" type="date"></div></div><div class="field"><label>Action concrète</label><textarea id="atxt"></textarea></div><button class="btn" onclick="addAction()">Ajouter</button></div><div class="card"><h3>Plan d’action</h3>${v.actions.map((a,i)=>`<div class="list-item"><span class="badge ${a.priority==='Haute'?'bad':a.priority==='Moyenne'?'warn':'info'}">${a.priority}</span> <b>${esc(a.theme)}</b> — ${esc(a.text)}<br><span class="small">Échéance : ${esc(a.date||'non définie')}</span></div>`).join('')||'<span class="small">Aucune action.</span>'}</div>`}
function addAction(){let v=activeVisit();if(!atxt.value.trim())return;v.actions.push({theme:atheme.value,priority:ap.value,date:ad.value,text:atxt.value.trim(),status:'À faire'});save()}
function renderReport(){let v=activeVisit(),f=activeFarm();if(!v){report.innerHTML='<div class="card">Ouvrez une visite.</div>';return}let ss=db.subjects.filter(s=>s.visitId===v.id),fs=getFindings();report.innerHTML=`<div class="card"><h2>Compte rendu – Audit Ovin</h2><p><b>${esc(f?.name||'')}</b><br>${esc(f?.owner||'')} • EDE ${esc(f?.ede||'')} • ${esc(f?.commune||'')}<br>Visite du ${v.date} – ${esc(v.type)} – ${esc(v.tech||'')}</p></div><div class="card"><h3>Sujets / lots observés</h3>${ss.map(s=>`<div>${esc(s.name)} — ${esc(s.stage)} — effectif ${s.count||1}</div>`).join('')||'Aucun'}</div><div class="card"><h3>Points à approfondir</h3>${fs.map(x=>`<div>• ${esc(x.text)}</div>`).join('')||'Aucun écart automatique détecté.'}</div><div class="card"><h3>Plan d’action</h3>${v.actions.map(a=>`<div>• <b>${esc(a.theme)}</b> – ${esc(a.text)} (${esc(a.priority)})</div>`).join('')||'Aucune action.'}</div><div class="card"><h3>Conclusion technicien</h3><textarea onchange="activeVisit().conclusion=this.value;save()">${esc(v.conclusion||'')}</textarea></div><div class="actions no-print"><button class="btn" onclick="window.print()">Imprimer / PDF</button><button class="btn alt" onclick="exportVisit()">Exporter la visite JSON</button></div>`}
function renderBackup(){let c=cloudCfg();backup.innerHTML=`<div class="card"><h2>Supabase / synchronisation</h2><div class="grid"><div class="field"><label>URL Supabase</label><input id="supaUrl" value="${esc(c.url)}"></div><div class="field"><label>Clé publique Supabase</label><input id="supaKey" type="password" value="${esc(c.key)}" placeholder="sb_publishable_... ou anon key"></div></div><div class="actions"><button class="btn" onclick="saveCloudConfig()">Enregistrer Supabase</button><button class="btn alt" onclick="testCloud()">Tester la connexion</button><button class="btn alt" onclick="cloudBackup(true)">Synchroniser maintenant</button><button class="btn alt" onclick="cloudRestore()">Restaurer depuis le cloud</button></div><p class="small">Projet préconfiguré : ${esc(DEFAULT_SUPABASE_URL)}. Les données Ovin utilisent uniquement la table <b>ovin_backups</b>. Les comptes et rôles proviennent de la table <b>profiles</b> commune avec les autres applications.</p></div><div class="card"><h2>Sauvegarde de secours</h2><div class="actions"><button class="btn" onclick="downloadAll()">Télécharger la sauvegarde complète</button><label class="btn alt">Restaurer JSON<input class="hidden" type="file" accept="application/json" onchange="restoreFile(this.files[0])"></label><button class="btn danger" onclick="if(confirm('Tout effacer sur cet appareil ?')){localStorage.removeItem(APP);location.reload()}">Effacer les données locales</button></div><p class="small">Les données restent enregistrées localement, même sans réseau. La synchronisation cloud reprend au retour de la connexion.</p></div><div class="card"><h3>Version</h3><p>Audit Ovin GDS 32-65 – v${APP_VERSION} Supabase</p><p class="small">Version autonome sans base métier ni import CSV.</p></div>`}
function download(name,obj){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadAll(){download(`Audit_Ovin_sauvegarde_${new Date().toISOString().slice(0,10)}.json`,db)}function exportVisit(){let v=activeVisit();download(`Audit_Ovin_${v.date}.json`,{farm:activeFarm(),visit:v,subjects:db.subjects.filter(s=>s.visitId===v.id)})}
function restoreFile(file){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save()}catch(e){alert('Fichier invalide')}};r.readAsText(file)}
initTabs();renderAll();{let c=cloudCfg();setCloudStatus(c.key?'☁️ Connexion requise':'☁️ Supabase à configurer')}initAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
