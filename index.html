<script>
const APP='auditOvinGDS_v1';
const APP_VERSION='1.6';
const DEFAULT_SUPABASE_URL='https://ckylznynqsefqkmtjcjf.supabase.co';
const CLOUD_ID='audit-ovin-main';
let cloudTimer=null, cloudBusy=false, cloudPending=false, renderPending=false;
let authSession=JSON.parse(localStorage.getItem('auditOvin.authSession')||'null');
let currentProfile=null;
function cloudCfg(){return {url:(localStorage.getItem('auditOvin.supabaseUrl')||localStorage.getItem('parage.supabaseUrl')||DEFAULT_SUPABASE_URL).replace(/\/rest\/v1\/?$/,'').replace(/\/$/,''),key:localStorage.getItem('auditOvin.supabaseKey')||localStorage.getItem('parage.supabaseKey')||''}}
function setCloudStatus(txt){let e=document.getElementById('cloudStatus');if(e)e.textContent=txt}
function authHeaders(extra={}){let c=cloudCfg();return Object.assign({'apikey':c.key,'Content-Type':'application/json'},authSession?.access_token?{'Authorization':'Bearer '+authSession.access_token}:{},extra)}
async function supa(path,opt={}){let c=cloudCfg();if(!c.key)throw new Error('Clé publique Supabase non renseignée');if(!authSession?.access_token)throw new Error('Utilisateur non connecté');let h=Object.assign(authHeaders(),opt.headers||{});let r=await fetch(c.url+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(r.status===401&&await refreshAuthSession()){h=Object.assign(authHeaders(),opt.headers||{});r=await fetch(c.url+'/rest/v1/'+path,Object.assign({},opt,{headers:h}))}return r}

function saveLoginCloudConfig(){
  let u=(document.getElementById('loginSupaUrl').value||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');
  let k=(document.getElementById('loginSupaKey').value||'').trim();
  if(!u||!k){document.getElementById('loginMessage').textContent='Renseignez l’URL et la clé publique.';return}
  localStorage.setItem('auditOvin.supabaseUrl',u);localStorage.setItem('auditOvin.supabaseKey',k);
  document.getElementById('loginMessage').textContent='Configuration Supabase enregistrée.';
}
async function signIn(){
  let email=(document.getElementById('loginEmail').value||'').trim(),password=document.getElementById('loginPassword').value||'',c=cloudCfg();
  if(!c.key){document.getElementById('loginMessage').textContent='Configurez d’abord la clé publique Supabase.';return}
  if(!email||!password){document.getElementById('loginMessage').textContent='Saisissez l’e-mail et le mot de passe.';return}
  document.getElementById('loginMessage').textContent='Connexion…';
  try{
    let r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    let data=await r.json();if(!r.ok)throw new Error(data.error_description||data.msg||'Connexion refusée');
    authSession=data;localStorage.setItem('auditOvin.authSession',JSON.stringify(data));
    await loadCurrentProfile();enterApplication();
  }catch(e){document.getElementById('loginMessage').textContent=e.message||'Erreur de connexion'}
}
async function refreshAuthSession(){
  if(!authSession?.refresh_token)return false;let c=cloudCfg();if(!c.key)return false;
  try{let r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:authSession.refresh_token})});if(!r.ok)return false;authSession=await r.json();localStorage.setItem('auditOvin.authSession',JSON.stringify(authSession));return true}catch{return false}
}
async function loadCurrentProfile(){
  let c=cloudCfg();let r=await fetch(c.url+'/rest/v1/profiles?id=eq.'+encodeURIComponent(authSession.user.id)+'&select=id,email,display_name,role,active',{headers:authHeaders()});
  if(r.status===401&&await refreshAuthSession())return loadCurrentProfile();
  if(!r.ok)throw new Error('Profil utilisateur introuvable.');
  let rows=await r.json();if(!rows.length)throw new Error('Aucun profil associé à ce compte.');
  currentProfile=rows[0];if(currentProfile.active===false)throw new Error('Ce compte a été désactivé.');
}
function enterApplication(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('userBox').classList.remove('hidden');
  document.getElementById('userBadge').textContent=(currentProfile.display_name||currentProfile.email)+' · '+(currentProfile.role||'technicien');
  setCloudStatus('☁️ Connecté');
  cloudRestoreSilent();
}
async function signOut(){
  try{let c=cloudCfg();await fetch(c.url+'/auth/v1/logout',{method:'POST',headers:authHeaders()})}catch{}
  authSession=null;currentProfile=null;localStorage.removeItem('auditOvin.authSession');location.reload();
}
async function cloudRestoreSilent(){
  if(isEditableActive()){cloudPending=true;return}
  try{
    let r=await supa('ovin_backups?id=eq.'+encodeURIComponent(CLOUD_ID)+'&select=payload,updated_at',{method:'GET'});
    if(!r.ok)return;let rows=await r.json();
    if(rows.length&&rows[0].payload){db=rows[0].payload;localStorage.setItem(APP,JSON.stringify(db));renderAll();setCloudStatus('☁️ Cloud à jour')}
  }catch(e){console.warn('Restauration silencieuse impossible',e)}
}
async function initAuth(){
  let c=cloudCfg();
  document.getElementById('loginSupaUrl').value=c.url;
  document.getElementById('loginSupaKey').value=c.key;
  if(!c.key){document.getElementById('loginMessage').textContent='Configurez la clé publique Supabase une fois sur cet appareil.';return}
  if(authSession?.access_token){
    try{await loadCurrentProfile();enterApplication();return}catch(e){
      if(await refreshAuthSession()){try{await loadCurrentProfile();enterApplication();return}catch{}}
      authSession=null;localStorage.removeItem('auditOvin.authSession');
    }
  }
}
function isEditableActive(){
  const e=document.activeElement;
  return !!(e && e.matches && e.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select'));
}
function scheduleCloudSync(){
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{
    if(isEditableActive()){cloudPending=true;setCloudStatus('☁️ Saisie locale • synchro en attente');return}
    cloudBackup(false);
  },1200);
}
function flushPendingCloud(){
  if(cloudPending && !isEditableActive()){cloudPending=false;cloudBackup(false)}
}
async function cloudBackup(showMessage=true){if(isEditableActive()&&!showMessage){cloudPending=true;setCloudStatus('☁️ Saisie locale • synchro en attente');return false}if(cloudBusy)return false;let c=cloudCfg();if(!c.key){setCloudStatus('☁️ Supabase à configurer');if(showMessage)alert('Renseignez la clé publique Supabase dans Sauvegarde.');return false}cloudBusy=true;setCloudStatus('☁️ Synchronisation…');try{let payload={id:CLOUD_ID,payload:db,updated_at:new Date().toISOString()};let r=await supa('ovin_backups?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());localStorage.setItem('auditOvin.lastSync',new Date().toISOString());setCloudStatus('☁️ Cloud à jour');if(showMessage)alert('Sauvegarde Supabase effectuée.');return true}catch(e){console.error(e);setCloudStatus('☁️ En attente d’envoi');if(showMessage)alert('Synchronisation impossible : '+e.message);return false}finally{cloudBusy=false}}
async function cloudRestore(){let c=cloudCfg();if(!c.key)return alert('Renseignez d’abord la clé publique Supabase.');if(!confirm('Restaurer les données Ovin depuis Supabase ? Les données locales seront remplacées par la sauvegarde cloud.'))return;setCloudStatus('☁️ Restauration…');try{let r=await supa('ovin_backups?id=eq.'+encodeURIComponent(CLOUD_ID)+'&select=payload,updated_at',{method:'GET'});if(!r.ok)throw new Error(await r.text());let rows=await r.json();if(!rows.length)return alert('Aucune sauvegarde Ovin trouvée dans Supabase.');db=rows[0].payload;localStorage.setItem(APP,JSON.stringify(db));renderAll();setCloudStatus('☁️ Cloud restauré');alert('Restauration terminée.')}catch(e){setCloudStatus('☁️ Erreur cloud');alert('Restauration impossible : '+e.message)}}
function saveCloudConfig(){let u=(document.getElementById('supaUrl').value||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');let k=(document.getElementById('supaKey').value||'').trim();localStorage.setItem('auditOvin.supabaseUrl',u||DEFAULT_SUPABASE_URL);localStorage.setItem('auditOvin.supabaseKey',k);if(document.getElementById('loginSupaUrl'))document.getElementById('loginSupaUrl').value=u||DEFAULT_SUPABASE_URL;if(document.getElementById('loginSupaKey'))document.getElementById('loginSupaKey').value=k;renderBackup();if(k){setCloudStatus('☁️ Prêt à synchroniser');cloudBackup(false)}else setCloudStatus('☁️ Supabase à configurer')}
async function testCloud(){let c=cloudCfg();if(!c.key)return alert('Renseignez la clé publique Supabase.');try{let r=await supa('ovin_backups?select=id&limit=1',{method:'GET'});if(!r.ok)throw new Error(await r.text());setCloudStatus('☁️ Connexion Supabase OK');alert('Connexion Supabase Ovin OK.')}catch(e){setCloudStatus('☁️ Erreur Supabase');alert('Connexion impossible : '+e.message)}}

  <div class="grid field-grid-compact"><div class="field"><label>Collègue</label><input value="${esc(r.reviewer||'')}" oninput="setReviewField('reviewer',this.value)" onblur="finishEditing()"></div><div class="field"><label>Lien direct</label><div class="actions"><button class="btn alt" onclick="copyReviewLink()">Copier le lien</button></div></div></div></div>
  <div class="review-grid">${reviewThemes.map(t=>`<div class="review-theme"><h4>${esc(t)}</h4><select onchange="setReviewTheme('${t.replace(/'/g,"\\'")}','status',this.value)">${['Non revu','Validé','À discuter','À modifier'].map(x=>`<option ${r.themes[t].status===x?'selected':''}>${x}</option>`).join('')}</select><textarea placeholder="Commentaire éventuel" oninput="setReviewTheme('${t.replace(/'/g,"\\'")}','note',this.value)" onblur="finishEditing()">${esc(r.themes[t].note||'')}</textarea></div>`).join('')}</div>
  <div class="card"><h3>Synthèse des points à reprendre</h3>${flags.length?flags.map(t=>`<div class="list-item"><b>${esc(t)}</b> — ${esc(r.themes[t].status)}${r.themes[t].note?' : '+esc(r.themes[t].note):''}</div>`).join(''):'<div class="badge ok">Aucun point marqué à discuter ou modifier.</div>'}<div class="field" style="margin-top:12px"><label>Conclusion de la relecture</label><textarea oninput="setReviewField('general',this.value)" onblur="finishEditing()">${esc(r.general||'')}</textarea></div><button class="btn" onclick="validateReview()">✓ Relecture terminée</button></div>`;
}
function applyReviewDeepLink(){
  try{
    const idv=new URLSearchParams(location.search).get('review');
    if(idv && db.visits.some(v=>v.id===idv)){db.activeVisitId=idv;localStorage.setItem(APP,JSON.stringify(db));setTimeout(()=>show('review'),50)}
  }catch(e){}
}

function renderReport(){let v=activeVisit(),f=activeFarm();if(!v){report.innerHTML='<div class="card">Ouvrez une visite.</div>';return}let ss=db.subjects.filter(s=>s.visitId===v.id),fs=getFindings();report.innerHTML=`<div class="card"><h2>Compte rendu – Audit Ovin</h2><p><b>${esc(f?.name||'')}</b><br>${esc(f?.owner||'')} • EDE ${esc(f?.ede||'')} • ${esc(f?.commune||'')}<br>Visite du ${v.date} – ${esc(v.type)} – ${esc(v.tech||'')}</p></div><div class="card"><h3>Sujets / lots observés</h3>${ss.map(s=>`<div>${esc(s.name)} — ${esc(s.stage)} — effectif ${s.count||1}</div>`).join('')||'Aucun'}</div><div class="card"><h3>Points à approfondir</h3>${fs.map(x=>`<div>• ${esc(x.text)}</div>`).join('')||'Aucun écart automatique détecté.'}</div><div class="card"><h3>Plan d’action</h3>${v.actions.map(a=>`<div>• <b>${esc(a.theme)}</b> – ${esc(a.text)} (${esc(a.priority)})</div>`).join('')||'Aucune action.'}</div><div class="card"><h3>Conclusion technicien</h3><textarea oninput="activeVisit().conclusion=this.value;saveLocalOnly()" onblur="finishEditing()">${esc(v.conclusion||'')}</textarea></div>${v.review?.validatedAt?`<div class="card"><h3>Relecture collègue</h3><p><b>${esc(v.review.reviewer||'Collègue')}</b> — relecture terminée.</p><p>${esc(v.review.general||'Aucune remarque générale.')}</p></div>`:''}<div class="actions no-print"><button class="btn" onclick="window.print()">Imprimer / PDF</button><button class="btn alt" onclick="exportVisit()">Exporter la visite JSON</button></div>`}
function renderBackup(){let c=cloudCfg();backup.innerHTML=`<div class="card"><h2>Supabase / synchronisation</h2><div class="grid"><div class="field"><label>URL Supabase</label><input id="supaUrl" value="${esc(c.url)}"></div><div class="field"><label>Clé publique Supabase</label><input id="supaKey" type="password" value="${esc(c.key)}" placeholder="sb_publishable_... ou anon key"></div></div><div class="actions"><button class="btn" onclick="saveCloudConfig()">Enregistrer Supabase</button><button class="btn alt" onclick="testCloud()">Tester la connexion</button><button class="btn alt" onclick="cloudBackup(true)">Synchroniser maintenant</button><button class="btn alt" onclick="cloudRestore()">Restaurer depuis le cloud</button></div><p class="small">Projet préconfiguré : ${esc(DEFAULT_SUPABASE_URL)}. Les données Ovin utilisent uniquement la table <b>ovin_backups</b>. Les comptes et rôles proviennent de la table <b>profiles</b> commune avec les autres applications.</p></div><div class="card"><h2>Sauvegarde de secours</h2><div class="actions"><button class="btn" onclick="downloadAll()">Télécharger la sauvegarde complète</button><label class="btn alt">Restaurer JSON<input class="hidden" type="file" accept="application/json" onchange="restoreFile(this.files[0])"></label><button class="btn danger" onclick="if(confirm('Tout effacer sur cet appareil ?')){localStorage.removeItem(APP);location.reload()}">Effacer les données locales</button></div><p class="small">Les données restent enregistrées localement, même sans réseau. La synchronisation cloud reprend au retour de la connexion.</p></div><div class="card"><h3>Version</h3><p>Audit Ovin GDS 32-65 – v${APP_VERSION} Supabase</p><p class="small">Version autonome sans base métier ni import CSV. Icône installable et suppression des visites ajoutées en v1.5. PWA renforcée, cache forcé et version visible en v1.6. Correctifs ergonomie/synchronisation/relecture portés depuis Audit Bovin v14.6.21.16.</p></div>`}
function download(name,obj){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadAll(){download(`Audit_Ovin_sauvegarde_${new Date().toISOString().slice(0,10)}.json`,db)}function exportVisit(){let v=activeVisit();download(`Audit_Ovin_${v.date}.json`,{farm:activeFarm(),visit:v,subjects:db.subjects.filter(s=>s.visitId===v.id)})}
function restoreFile(file){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save()}catch(e){alert('Fichier invalide')}};r.readAsText(file)}


let deferredInstallPrompt=null;
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true}
function refreshInstallButton(){
  const b=document.getElementById('installAppBtn');if(!b)return;
  if(isStandalone()){b.classList.add('hidden');return}
  if(deferredInstallPrompt){b.classList.remove('hidden');b.textContent='⬇ Installer'}
  else {b.classList.remove('hidden');b.textContent='⬇ Installation'}
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredInstallPrompt=e;refreshInstallButton();
});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;refreshInstallButton();});
async function installApp(){
  if(isStandalone())return;
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice}catch(e){}
    deferredInstallPrompt=null;refreshInstallButton();return;
  }
  const box=document.getElementById('installHelp'),txt=document.getElementById('installHelpText');
  if(box&&txt){
    txt.innerHTML='<p>Chrome ne propose pas encore l’installation pour cette page.</p><p><b>À faire une seule fois :</b> ferme complètement cet onglet, rouvre Audit Ovin depuis Chrome, puis actualise la page. Le bouton passera automatiquement à <b>⬇ Installer</b> dès que Chrome reconnaît l’application.</p><p>Si le menu Chrome affiche seulement « créer un raccourci », ne le choisis pas : ce serait à nouveau un simple raccourci avec le logo Chrome.</p>';
    box.classList.remove('hidden');
  }
}

function applyWorkMode(mode){
  const terrain=mode==='terrain';
  document.body.classList.toggle('terrain-mode',terrain);
  localStorage.setItem('auditOvin.workMode',terrain?'terrain':'bureau');
  const b=document.getElementById('workModeBtn');
  if(b)b.textContent=terrain?'🖥️ Bureau':'📱 Terrain';
}
function toggleWorkMode(){applyWorkMode(document.body.classList.contains('terrain-mode')?'bureau':'terrain')}
function initKeyboardDismissButton(){
  let b=document.createElement('button');
  b.id='keyboard-dismiss';b.className='keyboard-dismiss';b.type='button';b.innerHTML='⌄ <span>Clavier</span>';
  document.body.appendChild(b);
  const editable=e=>e&&e.matches&&e.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select');
  const update=()=>b.classList.toggle('visible',editable(document.activeElement));
  document.addEventListener('focusin',()=>setTimeout(update,0));
  document.addEventListener('focusout',()=>setTimeout(()=>{update();finishEditing()},130));
  b.addEventListener('pointerdown',e=>e.preventDefault());
  b.onclick=()=>{let e=document.activeElement;if(editable(e)){e.dispatchEvent(new Event('change',{bubbles:true}));e.blur()}b.classList.remove('visible')};
  if(window.visualViewport)window.visualViewport.addEventListener('resize',update);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target && e.target.matches('[data-measure-input]')){
    e.preventDefault();
    const inputs=[...document.querySelectorAll('[data-measure-input]')];
    const i=inputs.indexOf(e.target);
    e.target.dispatchEvent(new Event('input',{bubbles:true}));
    if(i>=0 && i<inputs.length-1){inputs[i+1].focus();inputs[i+1].select?.()}
    else e.target.blur();
  }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){localStorage.setItem(APP,JSON.stringify(db));}});
window.addEventListener('pagehide',()=>{localStorage.setItem(APP,JSON.stringify(db));});

initTabs();renderAll();applyWorkMode(localStorage.getItem('auditOvin.workMode')||'bureau');initKeyboardDismissButton();applyReviewDeepLink();{let c=cloudCfg();setCloudStatus(c.key?'☁️ Connexion requise':'☁️ Supabase à configurer')}initAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=1.6',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});refreshInstallButton();
</script>
</body></html>
